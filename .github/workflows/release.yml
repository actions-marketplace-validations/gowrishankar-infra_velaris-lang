name: release

on:
  push:
    tags: ["v*"]

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: velaris-windows.exe
            sep: ";"
          - os: ubuntu-latest
            asset: velaris-linux
            sep: ":"
          - os: macos-latest
            asset: velaris-macos
            sep: ":"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install with proofs, native speed, and PyInstaller
        run: pip install ".[full]" pyinstaller
      - name: Build standalone executable
        run: >
          pyinstaller --onefile --name velaris
          --collect-all z3 --collect-all llvmlite
          --add-data "stdlib${{ matrix.sep }}stdlib"
          velaris.py
      - name: Smoke test the executable
        shell: bash
        run: |
          ./dist/velaris* --version
          ./dist/velaris* doctor
          ./dist/velaris* examples/hello.vel
      - name: Rename asset
        shell: bash
        run: |
          cd dist
          for f in velaris velaris.exe; do
            [ -f "$f" ] && mv "$f" "${{ matrix.asset }}"
          done
          ls
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          generate_release_notes: true

  pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    # until a pending publisher exists on pypi.org this cannot succeed,
    # and a release should not be marked broken for that reason
    continue-on-error: true
    permissions:
      id-token: write            # trusted publishing, no API token stored
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the distribution
        run: |
          pip install build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  vscode:
    name: publish the VS Code extension
    runs-on: ubuntu-latest
    # needs a one-time VSCE_TOKEN secret; until then this is skipped
    if: ${{ github.repository_owner != '' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publish to the Marketplace
        working-directory: editor/vscode
        run: |
          if [ -z "$VSCE_TOKEN" ]; then
            echo "no VSCE_TOKEN secret set - skipping"
            exit 0
          fi
          npm install -g @vscode/vsce
          TAG="${GITHUB_REF_NAME#v}"       # the tag is the version
          npm version "$TAG" --no-git-tag-version --allow-same-version
          if vsce publish --pat "$VSCE_TOKEN"; then
            echo "published $TAG"
          elif vsce show gowrishankar-infra.velaris | grep -q "$TAG"; then
            echo "$TAG is already on the Marketplace - nothing to do"
          else
            echo "publish failed for a real reason"
            exit 1
          fi
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
